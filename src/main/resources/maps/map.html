<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    // Initialize map
    var map = L.map('map').setView([36.8065, 10.1815], 12); // Default to Tunis

    // Primary tile layer (OpenStreetMap)
    var primaryTiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        minZoom: 3,
        maxZoom: 18
    }).addTo(map);

    // Fallback tile layer 1 (OpenTopoMap)
    var fallbackTiles = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenTopoMap contributors',
        minZoom: 3,
        maxZoom: 18
    });

    // Handle tile loading errors
    primaryTiles.on('tileerror', function () {
        console.error('Primary tile failed to load, switching to fallback tiles.');
        attribution.addTo(map);
    });

    // Handle tile loading errors
    primaryTiles.on('tileerror', function () {
        console.error('Primary tile failed to load, switching to fallback tiles.');
        fallbackTiles.addTo(map);
    });


    // Optional: Add a scale bar
    L.control.scale({
        position: 'bottomleft',
        imperial: false // Use metric units
    }).addTo(map);
</script>
</body>
</html>
